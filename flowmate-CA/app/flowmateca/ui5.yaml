specVersion: "4.0"
metadata:
  name: flowmateca
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sapui5.hana.ondemand.com
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-proxy
      configuration:
        flp:
          theme: sap_horizon
