_schema-version: "3.3"
ID: flowmate-ca
version: 0.1.0
description: Flowmate CA - Commerce Automation
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p gen/router

modules:
  - name: flowmate-ca-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: flowmate-ca-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: flowmate-ca-auth
      - name: flowmate-ca-db
      - name: flowmate-ca-destination

  - name: flowmate-ca-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: flowmate-ca-db

  - name: flowmate-ca-app
    type: html5
    path: app/flowmateca
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      supported-platforms: []

  - name: flowmate-ca-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: flowmate-ca-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: flowmate-ca-app
          artifacts:
            - flowmateca_app-content.zip
          target-path: resources/

  - name: flowmate-ca-approuter
    type: nodejs
    path: gen/router
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - cp ../../router/package.json package.json
        - cp ../../router/xs-app.json xs-app.json
        - mkdir -p webapp
        - cp -R ../../app/flowmateca/dist/. webapp/
        - npm install --omit=dev
    requires:
      - name: flowmate-ca-auth
      - name: flowmate-ca-html5-runtime
      - name: flowmate-ca-destination
      - name: flowmate-ca-srv-api
        group: destinations
        properties:
          name: flowmate-ca-srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: flowmate-ca-destination-content
    type: com.sap.application.content
    requires:
      - name: flowmate-ca-auth
        parameters:
          service-key:
            name: flowmate-ca-auth-key
      - name: flowmate-ca-html5-host
        parameters:
          service-key:
            name: flowmate-ca-html5-host-key
      - name: flowmate-ca-srv-api
      - name: flowmate-common-auth
        parameters:
          service-key:
            name: flowmate-common-auth-key
      - name: flowmate-ca-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: flowmate-ca-srv-api
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: flowmate-ca-auth
              TokenServiceKeyName: flowmate-ca-auth-key
              URL: ~{flowmate-ca-srv-api/srv-url}
              HTML5.DynamicDestination: true
            - Name: flowmate-common-api
              Authentication: OAuth2ClientCredentials
              TokenServiceInstanceName: flowmate-common-auth
              TokenServiceKeyName: flowmate-common-auth-key
              URL: https://flowmate-common-srv-org-b-test.cfapps.ap11.hana.ondemand.com/odata/v4/flowmate-common
            - Name: flowmate-ca-html5-host
              ServiceInstanceName: flowmate-ca-html5-host
              ServiceKeyName: flowmate-ca-html5-host-key
              sap.cloud.service: flowmate.ca.service
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: flowmate-ca-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: flowmate-ca-${space}
        tenant-mode: dedicated

  - name: flowmate-ca-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: flowmate-ca-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update

  - name: flowmate-ca-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: flowmate-ca-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: flowmate-common-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: flowmate-common-auth
