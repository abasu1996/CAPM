_schema-version: 3.3.0
ID: suppliershield
version: 1.0.0
description: Supplier Shield full stack CAP application

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p gen/srv/db/data
        - cp db/data/db.suppliershield-SupplierShield.csv gen/srv/db/data/

modules:
  - name: suppliershield-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: suppliershield-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      buildpack: nodejs_buildpack
      keep-existing-routes: true
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm --prefix .. ci
        - npm --prefix .. run build
        - rm -rf resources
        - cp -R ../dist resources
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: false
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
