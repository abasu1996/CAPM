_schema-version: 3.3.0
ID: flowmate
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run swagger:generate
        - npx cds build --production
        - mkdir -p gen/srv/docs
        - cp docs/flowmate-openapi.json gen/srv/docs/flowmate-openapi.json
        - mkdir -p gen/router
modules:
  - name: flowmate-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: flowmate-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - flowmate_app-content.zip
          name: flowmate_app
          target-path: resources/

  - name: flowmate_app
    type: html5
    path: app/flowmate
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: flowmate-approuter
    type: nodejs
    path: gen/router
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    properties:
      INCOMING_CONNECTION_TIMEOUT: 600000
    build-parameters:
      builder: custom
      commands:
        - mkdir -p webapp
        - cp ../../router/package.json package.json
        - cp ../../router/xs-app.json xs-app.json
        - cp -R ../../app/flowmate/webapp/. webapp
        - npm install
    requires:
      - name: flowmate-auth
      - name: flowmate-html5-runtime
      - name: flowmate-destination
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 600000

  - name: flowmate-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: flowmate-auth
      - name: flowmate-db
      - name: flowmate-destination

  - name: flowmate-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: flowmate-db

  - name: flowmate-destination-content
    type: com.sap.application.content
    requires:
      - name: flowmate-auth
        parameters:
          service-key:
            name: flowmate-auth-key
      - name: flowmate-html5-repo-host
        parameters:
          service-key:
            name: flowmate-html5-repo-host-key
      - name: srv-api
      - name: flowmate-common-auth
        parameters:
          service-key:
            name: flowmate-common-auth-key
      - name: flowmate-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: srv-api
              TokenServiceInstanceName: flowmate-auth
              TokenServiceKeyName: flowmate-auth-key
              URL: ~{srv-api/srv-url}
              HTML5.Timeout: 600000
              HTML5.DynamicDestination: true
            - Name: flowmate-html5-repo-host
              ServiceInstanceName: flowmate-html5-repo-host
              ServiceKeyName: flowmate-html5-repo-host-key
              sap.cloud.service: flowmate.service
            - Authentication: OAuth2UserTokenExchange
              Name: flowmate-auth
              ServiceInstanceName: flowmate-auth
              ServiceKeyName: flowmate-auth-key
            - Name: flowmate-common-api
              Authentication: OAuth2ClientCredentials
              TokenServiceInstanceName: flowmate-common-auth
              TokenServiceKeyName: flowmate-common-auth-key
              URL: https://flowmate-common-srv-org-b-test.cfapps.ap11.hana.ondemand.com/odata/v4/flowmate-common
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: flowmate-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations: []
            existing_destinations_policy: update
      service: destination
      service-plan: lite

  - name: flowmate-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: flowmate-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: flowmate-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: flowmate-${space}
        tenant-mode: dedicated
  - name: flowmate-api-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: flowmate-api-auth
      path: ./xs-security-api.json
  - name: flowmate-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: flowmate-common-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: flowmate-common-auth
