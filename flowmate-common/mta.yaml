_schema-version: "3.3"
ID: flowmate-common
version: 1.0.0
description: Shared master data for Flowmate applications
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build

modules:
  - name: flowmate-common-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 2
      buildpack: nodejs_buildpack
      memory: 256M
      host: flowmate-common-srv-${space}
    build-parameters:
      builder: npm-ci
    provides:
      - name: flowmate-common-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: flowmate-common-auth
      - name: flowmate-common-db
      - name: flowmate-common-srv-autoscaler
        parameters:
          config:
            instance_min_count: 2
            instance_max_count: 8
            scaling_rules:
              - metric_type: cpu
                threshold: 70
                operator: ">="
                adjustment: "+1"
                breach_duration_secs: 120
                cool_down_secs: 180
              - metric_type: memoryutil
                threshold: 75
                operator: ">="
                adjustment: "+1"
                breach_duration_secs: 120
                cool_down_secs: 180
              - metric_type: responsetime
                threshold: 2500
                operator: ">"
                adjustment: "+1"
                breach_duration_secs: 120
                cool_down_secs: 180
              - metric_type: cpu
                threshold: 30
                operator: "<"
                adjustment: "-1"
                breach_duration_secs: 300
                cool_down_secs: 300

  - name: flowmate-common-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: flowmate-common-db

resources:
  - name: flowmate-common-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service-name: flowmate-common-auth
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: flowmate-common-${space}
        tenant-mode: dedicated

  - name: flowmate-common-db
    type: com.sap.xs.hdi-container
    parameters:
      service-name: flowmate-common-db
      service: hana
      service-plan: hdi-shared
  - name: flowmate-common-srv-autoscaler
    type: org.cloudfoundry.managed-service
    parameters:
      service: autoscaler
      service-plan: standard
      service-name: flowmate-common-srv-autoscaler
